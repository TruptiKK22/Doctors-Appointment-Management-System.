<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - Health Prime</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.signin-container {
    background: #fff;
    padding: 40px;
    border-radius: 20px;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    animation: slideUp 0.6s ease;
    position: relative;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.back-button {
    position: absolute;
    top: 15px;
    left: 15px;
    border: none;
    background: none;
    font-size: 24px;
    cursor: pointer;
    color: #333;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
    color: #333;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-weight: 500;
    color: #333;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 2px solid #ddd;
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #667eea;
}

.signin-btn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: none;
    color: white;
    font-size: 16px;
    border-radius: 12px;
    cursor: pointer;
}

.signin-btn:hover {
    opacity: 0.9;
}

.login-option {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #666;
}

.login-option a {
    color: #667eea;
    font-weight: bold;
    text-decoration: none;
}

.login-option a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="signin-container">

    <button class="back-button" onclick="history.back()">←</button>

    <h1>Create Account</h1>

    <form method="POST" action="connect.php" autocomplete="off">

        <div class="form-group">
            <label for="phone">Phone Number *</label>

            <input
                type="tel"
                id="phone"
                name="phone"
                required
                pattern="[0-9]{10}"
                maxlength="10"
                placeholder="Enter 10-digit number"
            >
        </div>

        <div class="form-group">
            <label for="firstName">First Name *</label>

            <input
                type="text"
                id="firstName"
                name="firstname"
                required
                minlength="2"
                placeholder="Enter first name"
            >
        </div>

        <div class="form-group">
            <label for="lastName">Last Name *</label>

            <input
                type="text"
                id="lastName"
                name="lastname"
                required
                minlength="2"
                placeholder="Enter last name"
            >
        </div>

        <div class="form-group">
            <label for="email">Email *</label>

            <input
                type="email"
                id="email"
                name="email"
                required
                placeholder="Enter email address"
            >
        </div>

        <div class="form-group">
            <label for="password">Password *</label>

            <input
                type="password"
                id="password"
                name="password"
                required
                minlength="8"
                placeholder="Enter password"
            >
        </div>

        <button type="submit" class="signin-btn">
            Create Account
        </button>

    </form>

    <div class="login-option">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

</body>
</html>
