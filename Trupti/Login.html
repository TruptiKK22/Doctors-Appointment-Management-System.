<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Health Prime</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);

            border-radius: 20px;

            padding: 40px;

            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);

            width: 100%;
            max-width: 400px;

            position: relative;
        }

        .back-button {
            position: absolute;

            top: 15px;
            left: 15px;

            border: none;
            background: none;

            font-size: 24px;

            cursor: pointer;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #333;

            font-size: 2.5rem;

            font-weight: 600;

            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;

            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #333;

            font-weight: 500;

            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;

            padding: 15px;

            border: 2px solid #e1e5e9;

            border-radius: 10px;

            font-size: 1rem;

            background: rgba(255, 255, 255, 0.8);
        }

        .form-group input:focus {
            outline: none;

            border-color: #667eea;

            background: white;
        }

        .signin-btn {
            width: 100%;

            padding: 15px;

            background: linear-gradient(
                135deg,
                #667eea 0%,
                #764ba2 100%
            );

            color: white;

            border: none;

            border-radius: 10px;

            font-size: 1.1rem;

            font-weight: 600;

            cursor: pointer;

            margin-bottom: 25px;
        }

        .signin-btn:hover {
            opacity: 0.9;
        }

        .signup-section {
            text-align: center;

            padding-top: 20px;

            border-top: 1px solid #e1e5e9;
        }

        .signup-section p {
            color: #666;

            margin-bottom: 10px;
        }

        .signup-link {
            color: #667eea;

            text-decoration: none;

            font-weight: 600;
        }

        .signup-link:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <button
            class="back-button"
            onclick="history.back()">
            ←
        </button>


        <div class="login-header">

            <h1>Login</h1>

            <p>
                Please sign in to your account
            </p>

        </div>


        <!-- LOGIN FORM -->

        <form
            id="loginForm"
            method="POST"
            action="login.php"
            autocomplete="off"
        >

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="Enter your email"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="Enter your password"
                >

            </div>


            <button
                type="submit"
                class="signin-btn"
            >
                Login
            </button>

        </form>


        <!-- CREATE ACCOUNT LINK -->

        <div class="signup-section">

            <p>
                Don't have an account?
            </p>
            <a href="signin.html?from=login.html" class="signup-link">
            Create Account
            </a>

        </div>

    </div>

</body>
</html>
